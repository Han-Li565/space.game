<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 星际大战 - 飞机射击游戏</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0a0a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Microsoft YaHei', 'SimHei', Arial, sans-serif;
    overflow: hidden;
}

#gameContainer {
    position: relative;
    border: 2px solid #00ffff;
    box-shadow: 0 0 30px rgba(0, 255, 255, 0.3), inset 0 0 30px rgba(0, 255, 255, 0.05);
    border-radius: 8px;
    overflow: hidden;
}

canvas {
    display: block;
    cursor: none;
}

#uiOverlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#scoreBoard {
    position: absolute;
    top: 15px;
    left: 15px;
    color: #00ffff;
    font-size: 16px;
    text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
    line-height: 1.8;
}

#scoreBoard span {
    color: #ffdd00;
    font-weight: bold;
}

#healthBar {
    position: absolute;
    top: 15px;
    right: 15px;
    text-align: right;
    color: #ff4444;
    font-size: 16px;
    text-shadow: 0 0 10px rgba(255, 68, 68, 0.8);
}

#healthBarInner {
    width: 150px;
    height: 14px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid #ff4444;
    border-radius: 7px;
    margin-top: 5px;
    overflow: hidden;
}

#healthFill {
    height: 100%;
    background: linear-gradient(90deg, #ff0000, #ff4444, #ff6666);
    border-radius: 7px;
    transition: width 0.3s ease;
    box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
}

#weaponInfo {
    position: absolute;
    bottom: 15px;
    left: 15px;
    color: #aaffaa;
    font-size: 14px;
    text-shadow: 0 0 8px rgba(170, 255, 170, 0.6);
}

#startScreen, #gameOverScreen, #pauseScreen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.85);
    pointer-events: auto;
    z-index: 10;
}

#startScreen h1 {
    font-size: 48px;
    color: #00ffff;
    text-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 40px rgba(0, 255, 255, 0.4);
    margin-bottom: 10px;
}

#startScreen .subtitle {
    font-size: 18px;
    color: #8888cc;
    margin-bottom: 40px;
}

#gameOverScreen h1 {
    font-size: 42px;
    color: #ff4444;
    text-shadow: 0 0 20px rgba(255, 68, 68, 0.8);
    margin-bottom: 15px;
}

#finalScore {
    font-size: 28px;
    color: #ffdd00;
    margin-bottom: 10px;
    text-shadow: 0 0 15px rgba(255, 221, 0, 0.6);
}

#finalWave {
    font-size: 20px;
    color: #aaaaff;
    margin-bottom: 30px;
}

#pauseScreen h1 {
    font-size: 42px;
    color: #ffdd00;
    text-shadow: 0 0 20px rgba(255, 221, 0, 0.8);
    margin-bottom: 30px;
}

.btn {
    padding: 15px 50px;
    font-size: 20px;
    border: 2px solid #00ffff;
    background: rgba(0, 255, 255, 0.1);
    color: #00ffff;
    border-radius: 8px;
    cursor: pointer;
    margin: 8px;
    font-family: inherit;
    transition: all 0.3s ease;
    pointer-events: auto;
}

.btn:hover {
    background: rgba(0, 255, 255, 0.3);
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
    transform: scale(1.05);
}

.controls {
    margin-top: 30px;
    color: #888;
    font-size: 14px;
    text-align: center;
    line-height: 2;
}

.controls strong {
    color: #00ffff;
}

#waveAnnounce {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 36px;
    color: #ffdd00;
    text-shadow: 0 0 20px rgba(255, 221, 0, 0.8), 0 0 40px rgba(255, 221, 0, 0.4);
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    transition: opacity 0.5s ease;
}

#comboDisplay {
    position: absolute;
    top: 50%;
    right: 30px;
    transform: translateY(-50%);
    font-size: 24px;
    color: #ff8800;
    text-shadow: 0 0 15px rgba(255, 136, 0, 0.8);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

#bossHealth {
    position: absolute;
    top: 55px;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    text-align: center;
    display: none;
    pointer-events: none;
}

#bossHealth .label {
    color: #ff4444;
    font-size: 14px;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
    margin-bottom: 3px;
}

#bossHealthBar {
    width: 100%;
    height: 10px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid #ff0000;
    border-radius: 5px;
    overflow: hidden;
}

#bossHealthFill {
    height: 100%;
    background: linear-gradient(90deg, #ff0000, #ff4400);
    border-radius: 5px;
    transition: width 0.2s ease;
}

.powerup-hint {
    position: absolute;
    bottom: 15px;
    right: 15px;
    color: #ffaa00;
    font-size: 13px;
    text-shadow: 0 0 8px rgba(255, 170, 0, 0.5);
    pointer-events: none;
    text-align: right;
    line-height: 1.6;
}
</style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="uiOverlay">
        <div id="scoreBoard">
            🏆 得分: <span id="score">0</span><br>
            🌊 波次: <span id="wave">1</span><br>
            💎 金币: <span id="coins">0</span>
        </div>
        <div id="healthBar">
            ❤️ 生命值
            <div id="healthBarInner">
                <div id="healthFill" style="width: 100%"></div>
            </div>
        </div>
        <div id="weaponInfo">🔫 普通射击</div>
        <div id="waveAnnounce"></div>
        <div id="comboDisplay"></div>
        <div id="bossHealth">
            <div class="label">⚠️ BOSS</div>
            <div id="bossHealthBar">
                <div id="bossHealthFill" style="width: 100%"></div>
            </div>
        </div>
        <div class="powerup-hint" id="powerupHint"></div>

        <!-- 开始画面 -->
        <div id="startScreen">
            <h1>🚀 星际大战</h1>
            <div class="subtitle">✨ Space Shooter ✨</div>
            <button class="btn" onclick="startGame()">🎮 开始游戏</button>
            <div class="controls">
                <strong>W A S D</strong> 或 <strong>方向键</strong> — 移动飞船<br>
                <strong>鼠标</strong> — 瞄准方向<br>
                <strong>空格 / 鼠标左键</strong> — 射击<br>
                <strong>E</strong> — 释放大招（需要能量）<br>
                <strong>P / ESC</strong> — 暂停<br>
            </div>
        </div>

        <!-- 游戏结束画面 -->
        <div id="gameOverScreen" style="display: none;">
            <h1>💀 游戏结束</h1>
            <div id="finalScore">得分: 0</div>
            <div id="finalWave">到达波次: 1</div>
            <button class="btn" onclick="startGame()">🔄 再来一局</button>
            <button class="btn" onclick="showStart()">🏠 返回主页</button>
        </div>

        <!-- 暂停画面 -->
        <div id="pauseScreen" style="display: none;">
            <h1>⏸️ 游戏暂停</h1>
            <button class="btn" onclick="resumeGame()">▶️ 继续游戏</button>
            <button class="btn" onclick="showStart()">🏠 返回主页</button>
        </div>
    </div>
</div>

<script>
// ==================== 游戏配置 ====================
var CONFIG = {
    WIDTH: 800,
    HEIGHT: 600,
    PLAYER_SPEED: 5,
    BULLET_SPEED: 10,
    ENEMY_BASE_SPEED: 1.5,
    STAR_COUNT: 120,
    MAX_PARTICLES: 300,
    POWERUP_DURATION: 8000,
    ULTIMATE_COST: 100,
    BOSS_EVERY_WAVES: 5
};

// ==================== 全局变量 ====================
var canvas, ctx;
var gameState = 'start'; // start, playing, paused, gameover
var score = 0;
var coins = 0;
var wave = 1;
var combo = 0;
var comboTimer = 0;
var ultimateEnergy = 0;
var playerHealth = 100;
var maxPlayerHealth = 100;
var weaponType = 'normal'; // normal, spread, laser, missile
var weaponTimer = 0;
var shieldActive = false;
var shieldTimer = 0;
var frameCount = 0;
var lastTime = 0;
var deltaTime = 0;
var enemySpawnTimer = 0;
var enemySpawnInterval = 90;
var waveTimer = 0;
var waveEnemyCount = 0;
var waveMaxEnemies = 8;
var bossActive = false;
var screenShake = 0;
var difficultyMultiplier = 1;

// 对象池
var player = null;
var bullets = [];
var enemyBullets = [];
var enemies = [];
var particles = [];
var powerups = [];
var stars = [];
var floatingTexts = [];
var boss = null;

// 输入
var keys = {};
var mouseX = 0, mouseY = 0;
var mouseDown = false;
var shootCooldown = 0;

// ==================== 初始化 ====================
function init() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    canvas.width = CONFIG.WIDTH;
    canvas.height = CONFIG.HEIGHT;

    // 事件监听
    document.addEventListener('keydown', function(e) {
        keys[e.key.toLowerCase()] = true;
        if (e.key === ' ') e.preventDefault();
        if (gameState === 'playing') {
            if (e.key.toLowerCase() === 'p' || e.key === 'Escape') {
                pauseGame();
            }
            if (e.key.toLowerCase() === 'e') {
                useUltimate();
            }
        }
    });
    document.addEventListener('keyup', function(e) {
        keys[e.key.toLowerCase()] = false;
    });
    canvas.addEventListener('mousemove', function(e) {
        var rect = canvas.getBoundingClientRect();
        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;
    });
    canvas.addEventListener('mousedown', function(e) {
        if (e.button === 0) mouseDown = true;
    });
    canvas.addEventListener('mouseup', function(e) {
        if (e.button === 0) mouseDown = false;
    });
    canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });

    // 初始化星空
    initStars();

    // 开始渲染循环（菜单背景也需要）
    requestAnimationFrame(gameLoop);
}

function initStars() {
    stars = [];
    for (var i = 0; i < CONFIG.STAR_COUNT; i++) {
        stars.push({
            x: Math.random() * CONFIG.WIDTH,
            y: Math.random() * CONFIG.HEIGHT,
            size: Math.random() * 2.5 + 0.5,
            speed: Math.random() * 2 + 0.5,
            brightness: Math.random() * 0.5 + 0.5
        });
    }
}

// ==================== 游戏流程 ====================
function startGame() {
    gameState = 'playing';
    score = 0;
    coins = 0;
    wave = 1;
    combo = 0;
    comboTimer = 0;
    ultimateEnergy = 0;
    playerHealth = 100;
    maxPlayerHealth = 100;
    weaponType = 'normal';
    weaponTimer = 0;
    shieldActive = false;
    shieldTimer = 0;
    frameCount = 0;
    enemySpawnTimer = 0;
    enemySpawnInterval = 90;
    waveTimer = 0;
    waveEnemyCount = 0;
    waveMaxEnemies = 8;
    bossActive = false;
    boss = null;
    screenShake = 0;
    difficultyMultiplier = 1;
    shootCooldown = 0;

    bullets = [];
    enemyBullets = [];
    enemies = [];
    particles = [];
    powerups = [];
    floatingTexts = [];

    player = {
        x: CONFIG.WIDTH / 2,
        y: CONFIG.HEIGHT - 80,
        width: 36,
        height: 40,
        invincible: 0,
        thrustPhase: 0
    };

    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('gameOverScreen').style.display = 'none';
    document.getElementById('pauseScreen').style.display = 'none';

    announceWave(1);
    updateUI();
}

function pauseGame() {
    if (gameState === 'playing') {
        gameState = 'paused';
        document.getElementById('pauseScreen').style.display = 'flex';
    }
}

function resumeGame() {
    if (gameState === 'paused') {
        gameState = 'playing';
        document.getElementById('pauseScreen').style.display = 'none';
        lastTime = performance.now();
    }
}

function gameOver() {
    gameState = 'gameover';
    document.getElementById('gameOverScreen').style.display = 'flex';
    document.getElementById('finalScore').textContent = '🏆 得分: ' + score;
    document.getElementById('finalWave').textContent = '🌊 到达波次: ' + wave;

    // 爆炸效果
    for (var i = 0; i < 50; i++) {
        createParticle(player.x, player.y, 'explosion');
    }
    screenShake = 20;
}

function showStart() {
    gameState = 'start';
    document.getElementById('startScreen').style.display = 'flex';
    document.getElementById('gameOverScreen').style.display = 'none';
    document.getElementById('pauseScreen').style.display = 'none';
}

// ==================== 游戏主循环 ====================
function gameLoop(timestamp) {
    deltaTime = timestamp - lastTime;
    lastTime = timestamp;
    if (deltaTime > 50) deltaTime = 16;

    if (gameState === 'playing') {
        frameCount++;
        update();
    }
    render();
    requestAnimationFrame(gameLoop);
}

// ==================== 更新逻辑 ====================
function update() {
    updatePlayer();
    updateShooting();
    updateBullets();
    updateEnemies();
    updateEnemyBullets();
    updatePowerups();
    updateParticles();
    updateFloatingTexts();
    updateWaveSystem();
    updateTimers();
    checkCollisions();
    updateUI();
    updateStars();

    if (screenShake > 0) screenShake *= 0.9;
    if (screenShake < 0.5) screenShake = 0;
}

function updatePlayer() {
    if (!player) return;

    var speed = CONFIG.PLAYER_SPEED;
    if (keys['w'] || keys['arrowup']) player.y -= speed;
    if (keys['s'] || keys['arrowdown']) player.y += speed;
    if (keys['a'] || keys['arrowleft']) player.x -= speed;
    if (keys['d'] || keys['arrowright']) player.x += speed;

    // 边界限制
    player.x = Math.max(player.width / 2, Math.min(CONFIG.WIDTH - player.width / 2, player.x));
    player.y = Math.max(player.height / 2, Math.min(CONFIG.HEIGHT - player.height / 2, player.y));

    player.thrustPhase += 0.15;

    if (player.invincible > 0) player.invincible--;

    // 引擎粒子
    if (frameCount % 2 === 0) {
        createParticle(player.x + (Math.random() - 0.5) * 10, player.y + player.height / 2, 'thrust');
    }
}

function updateShooting() {
    if (shootCooldown > 0) shootCooldown--;

    if ((keys[' '] || mouseDown) && shootCooldown <= 0) {
        shoot();
    }
}

function shoot() {
    var cooldown, damage;

    switch (weaponType) {
        case 'spread':
            cooldown = 12;
            damage = 8;
            for (var angle = -20; angle <= 20; angle += 10) {
                var rad = (angle - 90) * Math.PI / 180;
                bullets.push({
                    x: player.x,
                    y: player.y - player.height / 2,
                    vx: Math.cos(rad) * CONFIG.BULLET_SPEED,
                    vy: Math.sin(rad) * CONFIG.BULLET_SPEED,
                    damage: damage,
                    type: 'spread',
                    size: 3
                });
            }
            break;

        case 'laser':
            cooldown = 4;
            damage = 4;
            bullets.push({
                x: player.x,
                y: player.y - player.height / 2,
                vx: 0,
                vy: -CONFIG.BULLET_SPEED * 1.5,
                damage: damage,
                type: 'laser',
                size: 2
            });
            break;

        case 'missile':
            cooldown = 25;
            damage = 30;
            bullets.push({
                x: player.x,
                y: player.y - player.height / 2,
                vx: 0,
                vy: -CONFIG.BULLET_SPEED * 0.8,
                damage: damage,
                type: 'missile',
                size: 5,
                trail: true,
                target: findNearestEnemy()
            });
            break;

        default: // normal
            cooldown = 10;
            damage = 10;
            bullets.push({
                x: player.x - 8,
                y: player.y - player.height / 2,
                vx: 0,
                vy: -CONFIG.BULLET_SPEED,
                damage: damage,
                type: 'normal',
                size: 3
            });
            bullets.push({
                x: player.x + 8,
                y: player.y - player.height / 2,
                vx: 0,
                vy: -CONFIG.BULLET_SPEED,
                damage: damage,
                type: 'normal',
                size: 3
            });
            break;
    }

    shootCooldown = cooldown;
}

function findNearestEnemy() {
    var nearest = null;
    var nearestDist = Infinity;
    for (var i = 0; i < enemies.length; i++) {
        var dx = enemies[i].x - player.x;
        var dy = enemies[i].y - player.y;
        var dist = dx * dx + dy * dy;
        if (dist < nearestDist) {
            nearestDist = dist;
            nearest = enemies[i];
        }
    }
    if (boss && boss.health > 0) {
        var dx2 = boss.x - player.x;
        var dy2 = boss.y - player.y;
        if (dx2 * dx2 + dy2 * dy2 < nearestDist) nearest = boss;
    }
    return nearest;
}

function updateBullets() {
    for (var i = bullets.length - 1; i >= 0; i--) {
        var b = bullets[i];

        // 导弹追踪
        if (b.type === 'missile' && b.target) {
            var t = b.target;
            if (t.health && t.health > 0) {
                var dx = t.x - b.x;
                var dy = t.y - b.y;
                var dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0) {
                    b.vx += (dx / dist) * 0.5;
                    b.vy += (dy / dist) * 0.5;
                    var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
                    if (sp > CONFIG.BULLET_SPEED) {
                        b.vx = b.vx / sp * CONFIG.BULLET_SPEED;
                        b.vy = b.vy / sp * CONFIG.BULLET_SPEED;
                    }
                }
            }
            if (frameCount % 2 === 0) {
                createParticle(b.x, b.y, 'missile_trail');
            }
        }

        b.x += b.vx;
        b.y += b.vy;

        if (b.x < -20 || b.x > CONFIG.WIDTH + 20 || b.y < -20 || b.y > CONFIG.HEIGHT + 20) {
            bullets.splice(i, 1);
        }
    }
}

function updateEnemyBullets() {
    for (var i = enemyBullets.length - 1; i >= 0; i--) {
        var b = enemyBullets[i];
        b.x += b.vx;
        b.y += b.vy;

        if (b.x < -20 || b.x > CONFIG.WIDTH + 20 || b.y < -20 || b.y > CONFIG.HEIGHT + 20) {
            enemyBullets.splice(i, 1);
            continue;
        }

        // 检测和玩家碰撞
        if (player && player.invincible <= 0) {
            var dx = b.x - player.x;
            var dy = b.y - player.y;
            if (Math.abs(dx) < 15 && Math.abs(dy) < 18) {
                if (shieldActive) {
                    shieldActive = false;
                    shieldTimer = 0;
                    createFloatingText(player.x, player.y - 30, '🛡️ 护盾抵消!', '#00aaff');
                    for (var p = 0; p < 10; p++) createParticle(b.x, b.y, 'shield_break');
                } else {
                    takeDamage(b.damage || 10);
                }
                enemyBullets.splice(i, 1);
            }
        }
    }
}

function updateEnemies() {
    for (var i = enemies.length - 1; i >= 0; i--) {
        var e = enemies[i];
        e.phase = (e.phase || 0) + 0.02;

        switch (e.moveType) {
            case 'straight':
                e.y += e.speed;
                break;
            case 'zigzag':
                e.y += e.speed;
                e.x += Math.sin(e.phase * 3) * 2;
                break;
            case 'circle':
                e.y += e.speed * 0.5;
                e.x += Math.cos(e.phase * 2) * 3;
                break;
            case 'dive':
                if (e.y < CONFIG.HEIGHT * 0.3) {
                    e.y += e.speed * 0.5;
                } else {
                    var dxp = player.x - e.x;
                    var dyp = player.y - e.y;
                    var dp = Math.sqrt(dxp * dxp + dyp * dyp);
                    if (dp > 0) {
                        e.x += (dxp / dp) * e.speed * 1.5;
                        e.y += (dyp / dp) * e.speed * 1.5;
                    }
                }
                break;
            default:
                e.y += e.speed;
        }

        // 敌人射击
        e.shootTimer = (e.shootTimer || 0) + 1;
        if (e.canShoot && e.shootTimer >= e.shootInterval && e.y > 30 && e.y < CONFIG.HEIGHT - 50) {
            e.shootTimer = 0;
            enemyShoot(e);
        }

        // 出屏移除
        if (e.y > CONFIG.HEIGHT + 50 || e.x < -50 || e.x > CONFIG.WIDTH + 50) {
            enemies.splice(i, 1);
            combo = 0;
        }
    }

    // Boss 更新
    if (boss && boss.health > 0) {
        updateBoss();
    }
}

function enemyShoot(e) {
    if (!player) return;
    var dx = player.x - e.x;
    var dy = player.y - e.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist === 0) return;

    var speed = 4;
    enemyBullets.push({
        x: e.x,
        y: e.y + e.height / 2,
        vx: (dx / dist) * speed,
        vy: (dy / dist) * speed,
        damage: 8 + wave,
        color: e.bulletColor || '#ff4444'
    });
}

function updateBoss() {
    boss.phase = (boss.phase || 0) + 0.01;

    // Boss 移动
    if (boss.y < 80) {
        boss.y += 1;
    } else {
        boss.x += Math.sin(boss.phase * 2) * 2;
        boss.y += Math.sin(boss.phase * 3) * 0.5;
    }

    boss.x = Math.max(boss.width / 2 + 10, Math.min(CONFIG.WIDTH - boss.width / 2 - 10, boss.x));

    // Boss 攻击模式
    boss.attackTimer = (boss.attackTimer || 0) + 1;

    if (boss.attackTimer % 30 === 0) {
        // 扇形弹幕
        var numBullets = 5 + Math.floor(wave / 5);
        var spread = 60;
        for (var j = 0; j < numBullets; j++) {
            var angle = -spread / 2 + (spread / (numBullets - 1)) * j;
            var rad = (angle + 90) * Math.PI / 180;
            enemyBullets.push({
                x: boss.x,
                y: boss.y + boss.height / 2,
                vx: Math.cos(rad) * 3.5,
                vy: Math.sin(rad) * 3.5,
                damage: 12,
                color: '#ff8800'
            });
        }
    }

    if (boss.attackTimer % 90 === 45) {
        // 追踪弹
        if (player) {
            var dx = player.x - boss.x;
            var dy = player.y - boss.y;
            var d = Math.sqrt(dx * dx + dy * dy);
            if (d > 0) {
                enemyBullets.push({
                    x: boss.x,
                    y: boss.y + boss.height / 2,
                    vx: (dx / d) * 5,
                    vy: (dy / d) * 5,
                    damage: 15,
                    color: '#ff0088'
                });
            }
        }
    }

    // 更新 Boss 血条 UI
    var bossHealthEl = document.getElementById('bossHealth');
    bossHealthEl.style.display = 'block';
    document.getElementById('bossHealthFill').style.width = Math.max(0, (boss.health / boss.maxHealth) * 100) + '%';
}

function updatePowerups() {
    for (var i = powerups.length - 1; i >= 0; i--) {
        var p = powerups[i];
        p.y += 1.5;
        p.phase = (p.phase || 0) + 0.05;

        if (p.y > CONFIG.HEIGHT + 30) {
            powerups.splice(i, 1);
            continue;
        }

        // 玩家拾取
        if (player) {
            var dx = p.x - player.x;
            var dy = p.y - player.y;
            if (Math.abs(dx) < 25 && Math.abs(dy) < 25) {
                collectPowerup(p);
                powerups.splice(i, 1);
            }
        }
    }
}

function collectPowerup(p) {
    switch (p.type) {
        case 'health':
            playerHealth = Math.min(maxPlayerHealth, playerHealth + 25);
            createFloatingText(p.x, p.y, '+25 ❤️', '#44ff44');
            break;
        case 'spread':
            weaponType = 'spread';
            weaponTimer = CONFIG.POWERUP_DURATION;
            createFloatingText(p.x, p.y, '🔥 扩散射击!', '#ff8800');
            break;
        case 'laser':
            weaponType = 'laser';
            weaponTimer = CONFIG.POWERUP_DURATION;
            createFloatingText(p.x, p.y, '⚡ 激光射击!', '#00ffff');
            break;
        case 'missile':
            weaponType = 'missile';
            weaponTimer = CONFIG.POWERUP_DURATION;
            createFloatingText(p.x, p.y, '🚀 追踪导弹!', '#ff44ff');
            break;
        case 'shield':
            shieldActive = true;
            shieldTimer = CONFIG.POWERUP_DURATION;
            createFloatingText(p.x, p.y, '🛡️ 护盾启动!', '#00aaff');
            break;
        case 'energy':
            ultimateEnergy = Math.min(CONFIG.ULTIMATE_COST, ultimateEnergy + 30);
            createFloatingText(p.x, p.y, '+30 ⚡能量', '#ffdd00');
            break;
        case 'coin':
            coins += 5;
            createFloatingText(p.x, p.y, '+5 💎', '#ffdd00');
            break;
    }

    for (var i = 0; i < 8; i++) createParticle(p.x, p.y, 'powerup');
}

function updateTimers() {
    // 武器计时
    if (weaponTimer > 0) {
        weaponTimer -= deltaTime;
        if (weaponTimer <= 0) {
            weaponType = 'normal';
            weaponTimer = 0;
        }
    }

    // 护盾计时
    if (shieldTimer > 0) {
        shieldTimer -= deltaTime;
        if (shieldTimer <= 0) {
            shieldActive = false;
            shieldTimer = 0;
        }
    }

    // 连击计时
    if (comboTimer > 0) {
        comboTimer -= deltaTime;
        if (comboTimer <= 0) {
            combo = 0;
        }
    }
}

function updateWaveSystem() {
    waveTimer++;

    if (!bossActive) {
        enemySpawnTimer++;
        if (enemySpawnTimer >= enemySpawnInterval && waveEnemyCount < waveMaxEnemies) {
            spawnEnemy();
            enemySpawnTimer = 0;
            waveEnemyCount++;
        }

        // 波次结束条件：所有敌人生成且被消灭
        if (waveEnemyCount >= waveMaxEnemies && enemies.length === 0) {
            nextWave();
        }
    } else {
        // Boss 阶段，如果 boss 死了
        if (!boss || boss.health <= 0) {
            bossActive = false;
            document.getElementById('bossHealth').style.display = 'none';
            nextWave();
        }
    }
}

function nextWave() {
    wave++;
    waveTimer = 0;
    waveEnemyCount = 0;
    difficultyMultiplier = 1 + (wave - 1) * 0.15;
    waveMaxEnemies = Math.min(25, 8 + wave * 2);
    enemySpawnInterval = Math.max(20, 90 - wave * 5);

    // 每5波出Boss
    if (wave % CONFIG.BOSS_EVERY_WAVES === 0) {
        bossActive = true;
        spawnBoss();
        announceWave(wave, true);
    } else {
        announceWave(wave);
    }

    // 波次奖励
    score += wave * 50;
    coins += wave;
    createFloatingText(CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2 + 40, '+' + (wave * 50) + ' 波次奖励!', '#ffdd00');
}

function announceWave(w, isBoss) {
    var el = document.getElementById('waveAnnounce');
    if (isBoss) {
        el.textContent = '⚠️ 第 ' + w + ' 波 — BOSS 来袭! ⚠️';
        el.style.color = '#ff4444';
    } else {
        el.textContent = '🌊 第 ' + w + ' 波';
        el.style.color = '#ffdd00';
    }
    el.style.opacity = '1';
    setTimeout(function() { el.style.opacity = '0'; }, 2000);
}

// ==================== 生成函数 ====================
function spawnEnemy() {
    var types = ['fighter', 'scout', 'heavy'];
    if (wave >= 3) types.push('dive');
    if (wave >= 5) types.push('elite');

    var type = types[Math.floor(Math.random() * types.length)];
    var e = {
        x: Math.random() * (CONFIG.WIDTH - 60) + 30,
        y: -40,
        phase: Math.random() * Math.PI * 2,
        shootTimer: 0,
        type: type
    };

    switch (type) {
        case 'scout':
            e.width = 24; e.height = 24;
            e.health = 10 * difficultyMultiplier;
            e.speed = (2.5 + Math.random()) * difficultyMultiplier;
            e.moveType = 'zigzag';
            e.canShoot = false;
            e.scoreValue = 50;
            e.color = '#44ff44';
            break;
        case 'fighter':
            e.width = 30; e.height = 30;
            e.health = 20 * difficultyMultiplier;
            e.speed = (1.5 + Math.random() * 0.5) * difficultyMultiplier;
            e.moveType = 'straight';
            e.canShoot = true;
            e.shootInterval = Math.max(40, 80 - wave * 3);
            e.scoreValue = 100;
            e.color = '#ff4444';
            e.bulletColor = '#ff6666';
            break;
        case 'heavy':
            e.width = 40; e.height = 36;
            e.health = 50 * difficultyMultiplier;
            e.speed = (0.8 + Math.random() * 0.3) * difficultyMultiplier;
            e.moveType = 'straight';
            e.canShoot = true;
            e.shootInterval = Math.max(50, 100 - wave * 3);
            e.scoreValue = 200;
            e.color = '#ff8800';
            e.bulletColor = '#ffaa44';
            break;
        case 'dive':
            e.width = 28; e.height = 28;
            e.health = 15 * difficultyMultiplier;
            e.speed = (2 + Math.random()) * difficultyMultiplier;
            e.moveType = 'dive';
            e.canShoot = false;
            e.scoreValue = 150;
            e.color = '#ff44ff';
            break;
        case 'elite':
            e.width = 34; e.height = 34;
            e.health = 40 * difficultyMultiplier;
            e.speed = (1.8 + Math.random() * 0.5) * difficultyMultiplier;
            e.moveType = 'circle';
            e.canShoot = true;
            e.shootInterval = Math.max(30, 60 - wave * 2);
            e.scoreValue = 250;
            e.color = '#aa44ff';
            e.bulletColor = '#cc66ff';
            break;
    }

    e.maxHealth = e.health;
    enemies.push(e);
}

function spawnBoss() {
    boss = {
        x: CONFIG.WIDTH / 2,
        y: -80,
        width: 90,
        height: 70,
        health: (300 + wave * 80) * difficultyMultiplier,
        maxHealth: (300 + wave * 80) * difficultyMultiplier,
        phase: 0,
        attackTimer: 0,
        color: '#ff2200'
    };
}

function spawnPowerup(x, y) {
    var types = ['health', 'spread', 'laser', 'missile', 'shield', 'energy', 'coin'];
    var weights = [15, 10, 10, 8, 8, 12, 30]; // coin 最常见
    var totalWeight = 0;
    for (var w = 0; w < weights.length; w++) totalWeight += weights[w];
    var r = Math.random() * totalWeight;
    var cumulative = 0;
    var type = 'coin';
    for (var j = 0; j < types.length; j++) {
        cumulative += weights[j];
        if (r < cumulative) { type = types[j]; break; }
    }

    powerups.push({
        x: x,
        y: y,
        type: type,
        phase: 0,
        size: 14
    });
}

// ==================== 碰撞检测 ====================
function checkCollisions() {
    // 子弹 vs 敌人
    for (var i = bullets.length - 1; i >= 0; i--) {
        var b = bullets[i];
        var hit = false;

        for (var j = enemies.length - 1; j >= 0; j--) {
            var e = enemies[j];
            if (Math.abs(b.x - e.x) < (e.width / 2 + b.size) && Math.abs(b.y - e.y) < (e.height / 2 + b.size)) {
                e.health -= b.damage;
                hit = true;

                // 击中特效
                createParticle(b.x, b.y, 'hit');
                createParticle(b.x, b.y, 'hit');

                if (e.health <= 0) {
                    destroyEnemy(e, j);
                }
                break;
            }
        }

        // 子弹 vs Boss
        if (!hit && boss && boss.health > 0) {
            if (Math.abs(b.x - boss.x) < (boss.width / 2 + b.size) && Math.abs(b.y - boss.y) < (boss.height / 2 + b.size)) {
                boss.health -= b.damage;
                hit = true;
                createParticle(b.x, b.y, 'hit');

                if (boss.health <= 0) {
                    destroyBoss();
                }
            }
        }

        if (hit) {
            bullets.splice(i, 1);
        }
    }

    // 敌人 vs 玩家 (碰撞)
    if (player && player.invincible <= 0) {
        for (var k = enemies.length - 1; k >= 0; k--) {
            var en = enemies[k];
            if (Math.abs(en.x - player.x) < (en.width / 2 + player.width / 2 - 5) &&
                Math.abs(en.y - player.y) < (en.height / 2 + player.height / 2 - 5)) {
                if (shieldActive) {
                    shieldActive = false;
                    shieldTimer = 0;
                    createFloatingText(player.x, player.y - 30, '🛡️ 护盾抵消!', '#00aaff');
                    en.health -= 50;
                    if (en.health <= 0) destroyEnemy(en, k);
                    for (var sp = 0; sp < 10; sp++) createParticle(en.x, en.y, 'shield_break');
                } else {
                    takeDamage(20);
                    en.health -= 30;
                    if (en.health <= 0) destroyEnemy(en, k);
                }
            }
        }
    }
}

function destroyEnemy(e, index) {
    // 爆炸效果
    for (var p = 0; p < 12; p++) {
        createParticle(e.x, e.y, 'explosion');
    }

    // 连击
    combo++;
    comboTimer = 2000;
    var comboMultiplier = 1 + combo * 0.1;
    var gained = Math.floor(e.scoreValue * comboMultiplier);
    score += gained;
    ultimateEnergy = Math.min(CONFIG.ULTIMATE_COST, ultimateEnergy + 5);

    createFloatingText(e.x, e.y - 10, '+' + gained, '#ffdd00');
    if (combo >= 3) {
        createFloatingText(e.x, e.y - 30, combo + '连击!', '#ff8800');
    }

    // 掉落
    if (Math.random() < 0.3) {
        spawnPowerup(e.x, e.y);
    }

    enemies.splice(index, 1);
    screenShake = 3;
}

function destroyBoss() {
    // 大爆炸
    for (var p = 0; p < 60; p++) {
        createParticle(boss.x + (Math.random() - 0.5) * boss.width, boss.y + (Math.random() - 0.5) * boss.height, 'explosion');
    }

    var bossScore = 2000 + wave * 500;
    score += bossScore;
    coins += 20;
    ultimateEnergy = Math.min(CONFIG.ULTIMATE_COST, ultimateEnergy + 50);
    createFloatingText(boss.x, boss.y, '+' + bossScore + ' BOSS击破!', '#ffdd00');

    // 大量掉落
    for (var d = 0; d < 5; d++) {
        spawnPowerup(boss.x + (Math.random() - 0.5) * 80, boss.y + (Math.random() - 0.5) * 40);
    }

    screenShake = 15;
    boss = null;
    document.getElementById('bossHealth').style.display = 'none';
}

function takeDamage(dmg) {
    if (player.invincible > 0) return;

    playerHealth -= dmg;
    player.invincible = 60; // 1秒无敌
    screenShake = 8;

    createFloatingText(player.x, player.y - 30, '-' + dmg, '#ff4444');
    for (var i = 0; i < 8; i++) createParticle(player.x, player.y, 'damage');

    combo = 0;

    if (playerHealth <= 0) {
        playerHealth = 0;
        gameOver();
    }
}

function useUltimate() {
    if (ultimateEnergy < CONFIG.ULTIMATE_COST) return;

    ultimateEnergy = 0;
    screenShake = 12;

    // 全屏清除敌人子弹
    enemyBullets = [];

    // 对所有敌人造成大量伤害
    for (var i = enemies.length - 1; i >= 0; i--) {
        enemies[i].health -= 100;
        for (var p = 0; p < 5; p++) createParticle(enemies[i].x, enemies[i].y, 'ultimate');
        if (enemies[i].health <= 0) {
            destroyEnemy(enemies[i], i);
        }
    }

    // 对 Boss 伤害
    if (boss && boss.health > 0) {
        boss.health -= 150;
        for (var q = 0; q < 20; q++) createParticle(boss.x, boss.y, 'ultimate');
        if (boss.health <= 0) destroyBoss();
    }

    // 视觉效果
    for (var k = 0; k < 40; k++) {
        createParticle(player.x, player.y, 'ultimate_ring');
    }

    createFloatingText(CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2, '💥 终极大招! 💥', '#ffdd00');
}

// ==================== 粒子系统 ====================
function createParticle(x, y, type) {
    if (particles.length >= CONFIG.MAX_PARTICLES) return;

    var p = {
        x: x,
        y: y,
        life: 1,
        type: type
    };

    switch (type) {
        case 'explosion':
            p.vx = (Math.random() - 0.5) * 8;
            p.vy = (Math.random() - 0.5) * 8;
            p.size = Math.random() * 4 + 2;
            p.decay = 0.02 + Math.random() * 0.03;
            p.color = ['#ff4400', '#ff8800', '#ffcc00', '#ffffff'][Math.floor(Math.random() * 4)];
            break;
        case 'hit':
            p.vx = (Math.random() - 0.5) * 4;
            p.vy = (Math.random() - 0.5) * 4;
            p.size = Math.random() * 3 + 1;
            p.decay = 0.05;
            p.color = '#ffff88';
            break;
        case 'thrust':
            p.vx = (Math.random() - 0.5) * 1;
            p.vy = Math.random() * 3 + 1;
            p.size = Math.random() * 3 + 1;
            p.decay = 0.04;
            p.color = ['#00aaff', '#0088ff', '#4444ff'][Math.floor(Math.random() * 3)];
            break;
        case 'damage':
            p.vx = (Math.random() - 0.5) * 6;
            p.vy = (Math.random() - 0.5) * 6;
            p.size = Math.random() * 3 + 2;
            p.decay = 0.03;
            p.color = '#ff0000';
            break;
        case 'powerup':
            p.vx = (Math.random() - 0.5) * 4;
            p.vy = (Math.random() - 0.5) * 4;
            p.size = Math.random() * 3 + 2;
            p.decay = 0.03;
            p.color = ['#ffdd00', '#44ff44', '#00ffff'][Math.floor(Math.random() * 3)];
            break;
        case 'ultimate':
            p.vx = (Math.random() - 0.5) * 10;
            p.vy = (Math.random() - 0.5) * 10;
            p.size = Math.random() * 5 + 3;
            p.decay = 0.015;
            p.color = ['#ffdd00', '#ffffff', '#ffaa00'][Math.floor(Math.random() * 3)];
            break;
        case 'ultimate_ring':
            var angle = Math.random() * Math.PI * 2;
            var spd = 4 + Math.random() * 6;
            p.vx = Math.cos(angle) * spd;
            p.vy = Math.sin(angle) * spd;
            p.size = Math.random() * 4 + 2;
            p.decay = 0.01;
            p.color = '#ffdd00';
            break;
        case 'missile_trail':
            p.vx = (Math.random() - 0.5) * 2;
            p.vy = Math.random() * 2;
            p.size = Math.random() * 3 + 1;
            p.decay = 0.06;
            p.color = '#ff4400';
            break;
        case 'shield_break':
            var a2 = Math.random() * Math.PI * 2;
            p.vx = Math.cos(a2) * (2 + Math.random() * 3);
            p.vy = Math.sin(a2) * (2 + Math.random() * 3);
            p.size = Math.random() * 3 + 2;
            p.decay = 0.03;
            p.color = '#00aaff';
            break;
    }

    particles.push(p);
}

function updateParticles() {
    for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        p.vx *= 0.98;
        p.vy *= 0.98;

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

function createFloatingText(x, y, text, color) {
    floatingTexts.push({
        x: x,
        y: y,
        text: text,
        color: color,
        life: 1,
        vy: -1.5
    });
}

function updateFloatingTexts() {
    for (var i = floatingTexts.length - 1; i >= 0; i--) {
        var ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.life -= 0.015;
        if (ft.life <= 0) {
            floatingTexts.splice(i, 1);
        }
    }
}

function updateStars() {
    for (var i = 0; i < stars.length; i++) {
        stars[i].y += stars[i].speed;
        if (stars[i].y > CONFIG.HEIGHT) {
            stars[i].y = 0;
            stars[i].x = Math.random() * CONFIG.WIDTH;
        }
    }
}

// ==================== 渲染 ====================
function render() {
    ctx.save();

    // 屏幕震动
    if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
    }

    // 清屏（深空背景）
    ctx.fillStyle = '#050520';
    ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

    // 星空
    renderStars();

    if (gameState === 'playing' || gameState === 'paused' || gameState === 'gameover') {
        renderPowerups();
        renderBullets();
        renderEnemyBullets();
        renderEnemies();
        if (boss && boss.health > 0) renderBoss();
        renderPlayer();
        renderParticles();
        renderFloatingTexts();
        renderUltimateBar();
        renderCombo();
    }

    ctx.restore();
}

function renderStars() {
    for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var flicker = 0.7 + Math.sin(frameCount * 0.05 + i) * 0.3;
        ctx.globalAlpha = s.brightness * flicker;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function renderPlayer() {
    if (!player) return;
    if (gameState === 'gameover') return;

    ctx.save();
    ctx.translate(player.x, player.y);

    // 无敌闪烁
    if (player.invincible > 0 && frameCount % 6 < 3) {
        ctx.globalAlpha = 0.4;
    }

    // 护盾效果
    if (shieldActive) {
        ctx.strokeStyle = 'rgba(0, 170, 255, ' + (0.4 + Math.sin(frameCount * 0.1) * 0.2) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 28, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(0, 170, 255, 0.15)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(0, 0, 32, 0, Math.PI * 2);
        ctx.stroke();
    }

    // 飞船主体
    // 机身
    ctx.fillStyle = '#4488ff';
    ctx.beginPath();
    ctx.moveTo(0, -player.height / 2);          // 顶部尖端
    ctx.lineTo(-player.width / 2, player.height / 2 - 5);  // 左下
    ctx.lineTo(-5, player.height / 2 - 12);     // 左内凹
    ctx.lineTo(0, player.height / 2 - 8);       // 底部中间
    ctx.lineTo(5, player.height / 2 - 12);      // 右内凹
    ctx.lineTo(player.width / 2, player.height / 2 - 5);   // 右下
    ctx.closePath();
    ctx.fill();

    // 机翼高光
    ctx.fillStyle = '#66aaff';
    ctx.beginPath();
    ctx.moveTo(0, -player.height / 2);
    ctx.lineTo(-6, player.height / 4);
    ctx.lineTo(6, player.height / 4);
    ctx.closePath();
    ctx.fill();

    // 座舱
    ctx.fillStyle = '#00ffff';
    ctx.beginPath();
    ctx.arc(0, -5, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.arc(-1, -6, 2, 0, Math.PI * 2);
    ctx.fill();

    // 引擎光效
    var thrustLength = 8 + Math.sin(player.thrustPhase) * 4;
    var gradient = ctx.createLinearGradient(0, player.height / 2 - 8, 0, player.height / 2 - 8 + thrustLength);
    gradient.addColorStop(0, 'rgba(0, 150, 255, 0.8)');
    gradient.addColorStop(0.5, 'rgba(0, 100, 255, 0.4)');
    gradient.addColorStop(1, 'rgba(0, 50, 255, 0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.moveTo(-6, player.height / 2 - 8);
    ctx.lineTo(0, player.height / 2 - 8 + thrustLength);
    ctx.lineTo(6, player.height / 2 - 8);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

function renderBullets() {
    for (var i = 0; i < bullets.length; i++) {
        var b = bullets[i];
        ctx.save();

        switch (b.type) {
            case 'normal':
                ctx.fillStyle = '#00ffff';
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 8;
                ctx.fillRect(b.x - 1.5, b.y - 6, 3, 12);
                break;
            case 'spread':
                ctx.fillStyle = '#ff8800';
                ctx.shadowColor = '#ff8800';
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
                ctx.fill();
                break;
            case 'laser':
                ctx.fillStyle = '#00ff88';
                ctx.shadowColor = '#00ff88';
                ctx.shadowBlur = 10;
                ctx.fillRect(b.x - 1, b.y - 10, 2, 20);
                break;
            case 'missile':
                ctx.fillStyle = '#ff44ff';
                ctx.shadowColor = '#ff44ff';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.moveTo(b.x, b.y - 6);
                ctx.lineTo(b.x - 3, b.y + 4);
                ctx.lineTo(b.x + 3, b.y + 4);
                ctx.closePath();
                ctx.fill();
                break;
        }

        ctx.restore();
    }
}

function renderEnemyBullets() {
    for (var i = 0; i < enemyBullets.length; i++) {
        var b = enemyBullets[i];
        ctx.save();
        ctx.fillStyle = b.color || '#ff4444';
        ctx.shadowColor = b.color || '#ff4444';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

function renderEnemies() {
    for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        ctx.save();
        ctx.translate(e.x, e.y);

        // 根据类型绘制不同形状
        switch (e.type) {
            case 'scout':
                drawScout(e);
                break;
            case 'fighter':
                drawFighter(e);
                break;
            case 'heavy':
                drawHeavy(e);
                break;
            case 'dive':
                drawDive(e);
                break;
            case 'elite':
                drawElite(e);
                break;
            default:
                drawFighter(e);
        }

        // 血条
        if (e.health < e.maxHealth) {
            var barWidth = e.width;
            var barHeight = 3;
            ctx.fillStyle = 'rgba(255,0,0,0.4)';
            ctx.fillRect(-barWidth / 2, -e.height / 2 - 8, barWidth, barHeight);
            ctx.fillStyle = '#ff4444';
            ctx.fillRect(-barWidth / 2, -e.height / 2 - 8, barWidth * (e.health / e.maxHealth), barHeight);
        }

        ctx.restore();
    }
}

function drawScout(e) {
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.moveTo(0, e.height / 2);
    ctx.lineTo(-e.width / 2, -e.height / 2);
    ctx.lineTo(e.width / 2, -e.height / 2);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#88ff88';
    ctx.beginPath();
    ctx.arc(0, 2, 4, 0, Math.PI * 2);
    ctx.fill();
}

function drawFighter(e) {
    ctx.fillStyle = e.color;
    // 倒三角形 + 机翼
    ctx.beginPath();
    ctx.moveTo(0, e.height / 2);
    ctx.lineTo(-e.width / 2, -e.height / 3);
    ctx.lineTo(-e.width / 4, -e.height / 2);
    ctx.lineTo(e.width / 4, -e.height / 2);
    ctx.lineTo(e.width / 2, -e.height / 3);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ffaaaa';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();
}

function drawHeavy(e) {
    ctx.fillStyle = e.color;
    ctx.fillRect(-e.width / 2, -e.height / 2, e.width, e.height);

    // 装甲纹路
    ctx.strokeStyle = '#ffaa44';
    ctx.lineWidth = 1;
    ctx.strokeRect(-e.width / 2 + 3, -e.height / 2 + 3, e.width - 6, e.height - 6);

    ctx.fillStyle = '#ffcc44';
    ctx.beginPath();
    ctx.arc(0, 2, 6, 0, Math.PI * 2);
    ctx.fill();

    // 炮管
    ctx.fillStyle = '#cc6600';
    ctx.fillRect(-3, e.height / 2 - 2, 6, 8);
}

function drawDive(e) {
    ctx.fillStyle = e.color;
    // 菱形
    ctx.beginPath();
    ctx.moveTo(0, -e.height / 2);
    ctx.lineTo(e.width / 2, 0);
    ctx.lineTo(0, e.height / 2);
    ctx.lineTo(-e.width / 2, 0);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ff88ff';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();
}

function drawElite(e) {
    ctx.fillStyle = e.color;
    // 六边形
    ctx.beginPath();
    for (var i = 0; i < 6; i++) {
        var a = (i * 60 - 90) * Math.PI / 180;
        var r = e.width / 2;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ddaaff';
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI * 2);
    ctx.fill();

    // 旋转装饰
    ctx.strokeStyle = 'rgba(170, 68, 255, 0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, e.width / 2 + 4, (e.phase || 0), (e.phase || 0) + Math.PI);
    ctx.stroke();
}

function renderBoss() {
    if (!boss) return;
    ctx.save();
    ctx.translate(boss.x, boss.y);

    // Boss 主体 - 大型飞船
    ctx.fillStyle = '#cc0000';
    ctx.beginPath();
    ctx.moveTo(0, boss.height / 2);
    ctx.lineTo(-boss.width / 2, 0);
    ctx.lineTo(-boss.width / 3, -boss.height / 2);
    ctx.lineTo(-boss.width / 6, -boss.height / 2 + 10);
    ctx.lineTo(0, -boss.height / 2 - 5);
    ctx.lineTo(boss.width / 6, -boss.height / 2 + 10);
    ctx.lineTo(boss.width / 3, -boss.height / 2);
    ctx.lineTo(boss.width / 2, 0);
    ctx.closePath();
    ctx.fill();

    // 装甲
    ctx.fillStyle = '#ff3300';
    ctx.beginPath();
    ctx.moveTo(0, boss.height / 2 - 10);
    ctx.lineTo(-boss.width / 3, -5);
    ctx.lineTo(boss.width / 3, -5);
    ctx.closePath();
    ctx.fill();

    // Boss 眼睛
    ctx.fillStyle = '#ffdd00';
    ctx.shadowColor = '#ffdd00';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(-15, 5, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(15, 5, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ff0000';
    ctx.beginPath();
    ctx.arc(-15, 5, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(15, 5, 3, 0, Math.PI * 2);
    ctx.fill();

    // 脉冲光环
    ctx.strokeStyle = 'rgba(255, 0, 0, ' + (0.2 + Math.sin(frameCount * 0.05) * 0.15) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, boss.width / 2 + 10 + Math.sin(frameCount * 0.08) * 5, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
}

function renderPowerups() {
    for (var i = 0; i < powerups.length; i++) {
        var p = powerups[i];
        ctx.save();
        ctx.translate(p.x, p.y);

        var bob = Math.sin((p.phase || 0) + frameCount * 0.05) * 3;
        ctx.translate(0, bob);

        // 光晕
        ctx.shadowBlur = 12;

        var emoji, bgColor;
        switch (p.type) {
            case 'health':
                emoji = '❤️'; bgColor = '#44ff44'; ctx.shadowColor = '#44ff44'; break;
            case 'spread':
                emoji = '🔥'; bgColor = '#ff8800'; ctx.shadowColor = '#ff8800'; break;
            case 'laser':
                emoji = '⚡'; bgColor = '#00ffff'; ctx.shadowColor = '#00ffff'; break;
            case 'missile':
                emoji = '🚀'; bgColor = '#ff44ff'; ctx.shadowColor = '#ff44ff'; break;
            case 'shield':
                emoji = '🛡️'; bgColor = '#00aaff'; ctx.shadowColor = '#00aaff'; break;
            case 'energy':
                emoji = '⭐'; bgColor = '#ffdd00'; ctx.shadowColor = '#ffdd00'; break;
            case 'coin':
                emoji = '💎'; bgColor = '#ffdd00'; ctx.shadowColor = '#ffdd00'; break;
            default:
                emoji = '❓'; bgColor = '#ffffff'; ctx.shadowColor = '#ffffff';
        }

        // 背景圆
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = bgColor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, Math.PI * 2);
        ctx.stroke();

        ctx.font = '16px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(emoji, 0, 1);

        ctx.restore();
    }
}

function renderParticles() {
    for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

function renderFloatingTexts() {
    for (var i = 0; i < floatingTexts.length; i++) {
        var ft = floatingTexts[i];
        ctx.save();
        ctx.globalAlpha = ft.life;
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 16px "Microsoft YaHei", Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = ft.color;
        ctx.shadowBlur = 8;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
    }
}

function renderUltimateBar() {
    // 大招能量条
    var barX = 15;
    var barY = CONFIG.HEIGHT - 35;
    var barW = 120;
    var barH = 12;

    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.fillRect(barX, barY, barW, barH);

    var ratio = ultimateEnergy / CONFIG.ULTIMATE_COST;
    var grad = ctx.createLinearGradient(barX, barY, barX + barW * ratio, barY);
    grad.addColorStop(0, '#ffdd00');
    grad.addColorStop(1, ratio >= 1 ? '#ff8800' : '#886600');
    ctx.fillStyle = grad;
    ctx.fillRect(barX, barY, barW * ratio, barH);

    ctx.strokeStyle = ratio >= 1 ? '#ffdd00' : '#666';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barW, barH);

    ctx.fillStyle = ratio >= 1 ? '#ffdd00' : '#888';
    ctx.font = '10px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(ratio >= 1 ? '按E释放大招!' : '能量: ' + Math.floor(ratio * 100) + '%', barX, barY - 4);
}

function renderCombo() {
    var comboEl = document.getElementById('comboDisplay');
    if (combo >= 3) {
        comboEl.style.opacity = '1';
        comboEl.textContent = '🔥 ' + combo + 'x 连击';
    } else {
        comboEl.style.opacity = '0';
    }
}

// ==================== UI 更新 ====================
function updateUI() {
    document.getElementById('score').textContent = score;
    document.getElementById('wave').textContent = wave;
    document.getElementById('coins').textContent = coins;
    document.getElementById('healthFill').style.width = Math.max(0, (playerHealth / maxPlayerHealth) * 100) + '%';

    var weaponNames = {
        'normal': '🔫 普通射击',
        'spread': '🔥 扩散射击',
        'laser': '⚡ 激光射击',
        'missile': '🚀 追踪导弹'
    };
    var weaponText = weaponNames[weaponType] || '🔫 普通射击';
    if (weaponTimer > 0 && weaponType !== 'normal') {
        weaponText += ' (' + Math.ceil(weaponTimer / 1000) + 's)';
    }
    document.getElementById('weaponInfo').textContent = weaponText;

    // 道具提示
    var hints = [];
    if (shieldActive) hints.push('🛡️ 护盾: ' + Math.ceil(shieldTimer / 1000) + 's');
    document.getElementById('powerupHint').innerHTML = hints.join('<br>');
}

// ==================== 启动 ====================
window.onload = init;
</script>
